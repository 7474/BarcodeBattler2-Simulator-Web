name: Legacy UI previews

# Uploads earlier UI revisions to a separate, assets-only Worker
# (preview/wrangler.jsonc) as aliased Version URLs, for comparing how they
# look and feel. They are not connected to the Worker API, D1 or R2, so rooms
# and product lookup do not work there; local play does.
on:
  push:
    branches: [main]
    paths:
      - preview/**
      - .github/workflows/preview-legacy.yml
  workflow_dispatch:
    inputs:
      copilot_ref:
        description: Copilot revision (last main before the Cursor restyle)
        default: 5bf7dbd
      cursor_ref:
        description: Cursor revision (PR #7 merge)
        default: 2070c34

permissions:
  contents: read

concurrency:
  group: legacy-previews
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build legacy revisions
        run: |
          set -euo pipefail
          build() {
            git worktree add --detach "legacy/$1" "$2"
            (cd "legacy/$1" && npm ci && npm run build)
          }
          build copilot "${{ inputs.copilot_ref || '5bf7dbd' }}"
          build cursor "${{ inputs.cursor_ref || '2070c34' }}"

      # The landing page is the Worker's production version; it links to the aliases.
      - name: Deploy landing page
        run: npx wrangler deploy -c preview/wrangler.jsonc

      - name: Upload aliased versions
        run: |
          set -euo pipefail
          {
            echo '## Legacy UI previews'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for alias in copilot cursor; do
            ref=$(git -C "legacy/$alias" rev-parse --short HEAD)
            npx wrangler versions upload -c preview/wrangler.jsonc --assets "legacy/$alias/dist" \
              --preview-alias "$alias" --tag "$alias-$ref" --message "$alias UI at $ref (assets only)" | tee "upload-$alias.log"
            url=$(grep -oE "https://$alias-[a-z0-9.-]+\.workers\.dev" "upload-$alias.log" | head -1 || true)
            echo "- $alias ($ref): ${url:-see the job log}" >> "$GITHUB_STEP_SUMMARY"
          done
